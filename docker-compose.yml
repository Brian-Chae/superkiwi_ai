version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: superkiwi_postgres
    environment:
      POSTGRES_USER: superkiwi
      POSTGRES_PASSWORD: superkiwi_dev
      POSTGRES_DB: superkiwi_db
    ports:
      - "5787:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superkiwi"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

